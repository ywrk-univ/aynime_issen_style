[package]
name = "aynime-issen"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"

# Windows APIs (DXGI, User32, etc.)
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

# Image processing
image = { version = "0.25", features = ["png", "webp", "gif"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Error handling
anyhow = "1"

# Serialization (for settings)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Zip extraction (for tool download)
zip = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
